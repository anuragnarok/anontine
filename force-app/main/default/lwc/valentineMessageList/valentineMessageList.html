<template>
    <div class="message-container">
        <template for:each={messages} for:item="msg">
            <div key={msg.Id} class="message-card">
                <p class="message-text">"{msg.Messages__c}"</p>
                <p class="timestamp">Posted on: {msg.formattedDate}</p>
                <div class="emoji-reactions">
                    <button data-id={msg.Id} onclick={handleReaction}>❤️ {msg.Like_Count__c}</button>
                </div>
            </div>
        </template>
    </div>
</template>
